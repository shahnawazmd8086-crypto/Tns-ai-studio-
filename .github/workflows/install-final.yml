name: Install Final Verified Project

on:
  push:
    paths:
      - "TNS-AI-Studio-final-verified.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          test -f TNS-AI-Studio-final-verified.zip

      - name: Extract project
        run: |
          rm -rf /tmp/tns-extract /tmp/tns-project
          mkdir -p /tmp/tns-extract /tmp/tns-project

          unzip -q TNS-AI-Studio-final-verified.zip -d /tmp/tns-extract

          ROOT=$(find /tmp/tns-extract -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -n "$ROOT" ]; then
            cp -a "$ROOT"/. /tmp/tns-project/
          else
            cp -a /tmp/tns-extract/. /tmp/tns-project/
          fi

      - name: Install final project files
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "TNS-AI-Studio-final-verified.zip" \
            -exec rm -rf {} +

          cp -a /tmp/tns-project/. .

          rm -f TNS-AI-Studio-final-verified.zip

      - name: Commit final project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Install final verified TNS AI Studio" || exit 0
          git push
