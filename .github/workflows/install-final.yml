name: TNS Studio - Final Verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify TNS Studio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required project files
        run: |
          test -f package.json
          test -f server/server.js
          test -f public/index.html
          test -d public
          test -d server
          echo "Required project files OK"

      - name: Validate package.json
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json OK')"

      - name: Check JavaScript syntax
        run: |
          find public server -type f -name "*.js" -print0 |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done

      - name: Install dependencies
        run: npm install

      - name: Final verification
        run: |
          
echo "TNS Studio verification completed successfully."
